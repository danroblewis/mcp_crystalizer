# MCP server registry: the project's defaults. The effective registry for a workspace is this file, then
# ~/.mcp.json, then <workspace>/.mcp.json (later wins per server name) -- see crystal/registry.py and
# `crystal servers`. Entries use the mcp.json shape (command + args + optional env/cwd, or type: http|sse + url +
# headers); `{{workspace}}` / `{{project}}` are substituted, `${VAR}` / `${VAR:-default}` expanded. Relative paths
# are taken from this directory. An optional `module` (+ `attr`, default "mcp") names the importable MCPServer
# instance for the in-process transport (CRYSTAL_INPROCESS=1; see crystal/mcp_client.py); it is inferred for python
# scripts inside the project, and it is never written to an mcp.json.
#
# The simulated world is the project's own workspace (slug `sim`): its .mcp.json pins `code` and `git` to the sim
# repo (sim/servers/code.py, git.py); any other workspace gets the generic servers below over its own directory.
servers:
  jira:         { command: .venv/bin/python, args: [ sim/servers/jira.py],         module: sim.servers.jira }
  slack:        { command: .venv/bin/python, args: [ sim/servers/slack.py],        module: sim.servers.slack }
  confluence:   { command: .venv/bin/python, args: [ sim/servers/confluence.py],   module: sim.servers.confluence }
  logz:         { command: .venv/bin/python, args: [ sim/servers/logz.py],         module: sim.servers.logz }
  chronosphere: { command: .venv/bin/python, args: [ sim/servers/chronosphere.py], module: sim.servers.chronosphere }
  pagerduty:    { command: .venv/bin/python, args: [ sim/servers/pagerduty.py],    module: sim.servers.pagerduty }
  # generic, over the workspace: grep/glob/read_file/codeowners and git_log/git_show/git_grep/git_blame
  git:          { command: .venv/bin/python, args: [ crystal/servers/git.py,  --root, "{{workspace}}"], module: crystal.servers.git }
  code:         { command: .venv/bin/python, args: [ crystal/servers/code.py, --root, "{{workspace}}"], module: crystal.servers.code }
  # not a sim: exposes the crystallized flows (list_flows / run_flow) so the authoring agent tries them before exploring
  flows:        { command: .venv/bin/python, args: [ sim/servers/flows.py],        module: sim.servers.flows }
