# MCP server registry used by the flow runner and the recorder.
# Each entry: command + args (+ optional cwd/env). Swap these for the real corporate servers later.
servers:
  jira:         { command: .venv/bin/python, args: [ sim/servers/jira.py] }
  slack:        { command: .venv/bin/python, args: [ sim/servers/slack.py] }
  confluence:   { command: .venv/bin/python, args: [ sim/servers/confluence.py] }
  logz:         { command: .venv/bin/python, args: [ sim/servers/logz.py] }
  chronosphere: { command: .venv/bin/python, args: [ sim/servers/chronosphere.py] }
  pagerduty:    { command: .venv/bin/python, args: [ sim/servers/pagerduty.py] }
  git:          { command: .venv/bin/python, args: [ sim/servers/git.py] }
  code:         { command: .venv/bin/python, args: [ sim/servers/code.py] }
  # not a sim: exposes the crystallized flows (list_flows / run_flow) so the authoring agent tries them before exploring
  flows:        { command: .venv/bin/python, args: [ sim/servers/flows.py] }
