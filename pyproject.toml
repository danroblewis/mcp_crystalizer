[project]
name = "mcp-explorer"
version = "0.1.0"
description = "A uvx frontend for MCP servers and mcp.json files: open the current directory as a workspace, record Claude Code sessions, crystallize them into repeatable flows that run with no AI."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "jsonpath-ng>=1.8.0",
    "mcp>=2.2.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
mcp-explorer = "crystal.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crystal"]

[tool.hatch.build.targets.sdist]
include = ["crystal", "README.md", "pyproject.toml"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
