name: investigate-jira-ticket
title: Investigate a Jira ticket
description: >
  Given a Jira key: read the ticket, find the Slack discussion, the code that emits the error, the owning
  team, the runbook, the error-rate metric, the log lines for every trace id mentioned anywhere, the commits
  that touched the service just before, and the PagerDuty incident. Mirrors the agent flow
  jira -> slack -> codebase -> confluence -> chronosphere + logz.
status: candidate
version: 1
trigger: { type: jira_issue }
inputs:
  key: { type: jira_key, required: true, label: Jira issue key, example: PAY-101 }

steps:
  - id: issue
    title: Jira ticket
    tool: jira.jira_get_issue
    required: true
    args: { issue_key: "{{ inputs.key }}" }
    extract:
      summary:     { from: fields.summary }
      created:     { from: fields.created }
      service:     { from: "fields.components[*].name", using: "catalog:service" }
      service_in_text: { from: fields.description, using: "catalog:service" }
      error_sig:   { from: fields.description, using: regex, pattern: '^Error:\s*(.+)$' }
      error_class: { from: fields.description, using: "ids:error_class" }
      trace_ids:   { from: fields.description, using: "ids:trace_id", all: true }
      pods:        { from: fields.description, using: "ids:k8s_pod", all: true }
      window:      { from: fields.created, using: window, before: 1h, after: 6h }
      commit_window: { from: fields.created, using: window, before: 4d, after: 1d }

  - id: slack
    title: Slack discussion
    tool: slack.conversations_search_messages
    hits: messages.matches
    args:
      limit: 20
      search_query:
        ladder:
          - '"{{ issue.error_sig }}" in:#{{ catalog.service[issue.service].incident_channel }} after:{{ issue.window.start_date }} before:{{ issue.window.end_date }}'
          - '"{{ issue.error_sig }}" after:{{ issue.window.start_date }} before:{{ issue.window.end_date }}'
          - '{{ inputs.key }}'
          - '"{{ issue.error_sig }}"'
          - '{{ issue.error_class }} in:#{{ catalog.service[issue.service].slack_channel }}'
          - '{{ issue.error_class }}'
    extract:
      channel_id: { from: "messages.matches[0].channel.id" }
      thread_ts:  { from: "messages.matches[*].thread_ts", all: true }
      trace_ids:  { from: "messages.matches[*].text", using: "ids:trace_id", all: true }

  - id: thread
    title: Slack thread replies
    tool: slack.conversations_replies
    forEach: slack.thread_ts | unique | list
    max_items: 3
    hits: messages
    args: { channel_id: "{{ slack.channel_id }}", thread_ts: "{{ item }}", limit: 50 }
    extract:
      trace_ids: { from: "messages[*].text", using: "ids:trace_id", all: true }
      shas:      { from: "messages[*].text", using: "ids:sha_short", all: true }
      people:    { from: "messages[*].username", all: true }

  - id: code
    title: Code that raises or logs the error
    tool: code.grep
    hits: matches
    args: { pattern: "{{ issue.error_class }}", glob: "**/*.py", context: 2 }
    extract:
      files: { from: "matches[*].file", all: true }

  - id: owners
    title: Owning team (CODEOWNERS)
    tool: code.codeowners
    forEach: code.files | unique | list
    max_items: 3
    args: { path: "{{ item }}" }
    extract:
      teams: { from: "owners[*]", all: true }

  - id: confluence
    title: Runbook / wiki
    tool: confluence.confluence_search
    hits: results
    args:
      limit: 5
      query:
        ladder:
          - 'text ~ "{{ issue.error_class }}" AND space = {{ catalog.service[issue.service].confluence_space }}'
          - 'text ~ "{{ issue.error_class }}"'
          - 'title ~ "{{ issue.service }}" AND label = runbook'
          - 'text ~ "{{ issue.service }}"'
    extract:
      page_ids: { from: "results[*].id", all: true }

  - id: runbook
    title: Runbook page
    tool: confluence.confluence_get_page
    forEach: confluence.page_ids | head(2)
    args: { page_id: "{{ item }}" }
    extract:
      remediation: { from: body, using: regex, pattern: '^Remediation:\s*(.+)$', all: true }

  - id: metrics
    title: Error rate around the incident
    tool: chronosphere.query_prometheus_range
    hits: data.result
    args:
      query: 'rate(http_requests_total{service="{{ issue.service }}",code=~"5.."}[5m])'
      start: "{{ issue.window.start }}"
      end: "{{ issue.window.end }}"
      step_seconds: 300

  - id: logs
    title: Logs per trace id
    tool: logz.search_logs
    forEach: (issue.trace_ids + slack.trace_ids + thread.trace_ids) | unique | list
    max_items: 6
    hits: hits
    args:
      query: "trace_id:{{ item }}"
      from_time: "{{ issue.window.start }}"
      to_time: "{{ issue.window.end }}"
      size: 20
    extract:
      pods:  { from: "hits[*]._source.['kubernetes.pod_name']", all: true }
      lines: { from: "hits[*]._source.message", all: true }

  - id: logs_by_error
    title: All log lines with this error in the window
    tool: logz.search_logs
    hits: hits
    args:
      query:
        ladder:
          - '"{{ issue.error_sig }}" AND service:{{ issue.service }}'
          - '"{{ issue.error_class }}"'
          - '{{ issue.error_sig | tokens | head(4) | and }}'
      from_time: "{{ issue.window.start }}"
      to_time: "{{ issue.window.end }}"
      size: 50

  - id: commits
    title: Commits touching the service just before
    tool: git.git_log
    hits: commits
    args:
      path: "{{ catalog.service[issue.service].repo_path }}"
      since: "{{ issue.commit_window.start }}"
      until: "{{ issue.commit_window.end }}"
      max_count: 10
    extract:
      shas: { from: "commits[*].sha", all: true }

  - id: suspect_commit
    title: Commit named in Slack
    tool: git.git_show
    forEach: thread.shas | unique | list
    max_items: 2
    args: { sha: "{{ item }}" }

  - id: pagerduty
    title: PagerDuty incident
    tool: pagerduty.list_incidents
    hits: incidents
    args:
      service_ids: "{{ catalog.service[issue.service].pagerduty_service_id }}"
      since: "{{ issue.window.start }}"
      until: "{{ issue.window.end }}"
      limit: 5

  - id: repeats
    title: Earlier tickets with the same error on this service
    tool: jira.jira_search
    when: "{{ issue.error_class and issue.service }}"
    hits: issues
    args:
      jql: 'text ~ "{{ issue.error_class }}" AND component = {{ issue.service }} AND key != {{ inputs.key }} ORDER BY updated DESC'
      limit: 5
    extract:
      jira_keys: { from: "issues[*].key", all: true }
      statuses:  { from: "issues[*].fields.status.name", all: true }
      summaries: { from: "issues[*].fields.summary", all: true }
      dates:     { from: "issues[*].fields.created", all: true }

# Flow card: what the catalog and the top of the dossier show; expected_outputs are the acceptance criteria a run is
# judged against ("found N of M"). Hand-written from what the flow does and what the real agent runs found.
card:
  use_case: >-
    You have the Jira key of a production incident (PAY-101, AUTH-122) and want the whole picture before touching
    anything: what broke and when, where the team discussed it, the code that raises the error, who owns it, the
    runbook, the error-rate curve, the log lines behind every trace id anyone mentioned, what shipped just before, the
    PagerDuty incident, and whether the same error has hit this service before.
  inputs_explained:
    key: >-
      The Jira issue key, e.g. PAY-101. The ticket's components field names the service, its description carries the
      error signature, a sample trace id and the affected pod, and its created time anchors every window (-1h..+6h for
      logs, metrics and PagerDuty; -4d..+1d for commits).
  expected_outputs:
    - name: ticket
      steps: [issue]
      description: >-
        The ticket itself: summary, status, the service (from components), the error signature and class, the trace
        ids and pods in the description, and the time windows derived from created. Everything else keys off this.
      required: true
    - name: slack discussion
      steps: [slack, thread]
      description: >-
        The incident thread in the service's incident channel (found by error signature and date, falling back to the
        key and then the error class) and its replies: who was in it, the trace ids they pasted, the short commit shas
        they named.
      required: true
    - name: code
      steps: [code, owners]
      description: The source lines that raise or log the error class, and the CODEOWNERS team for those files.
      required: false
    - name: runbook
      steps: [confluence, runbook]
      description: >-
        The service's runbook in the team's Confluence space (and, for a repeat, the postmortem that mentions the error
        class), with the Remediation line pulled out.
      required: false
    - name: metrics
      steps: [metrics]
      description: The service's 5xx rate from an hour before the ticket was filed to six hours after.
      required: false
    - name: logs
      steps: [logs, logs_by_error]
      description: >-
        Log lines per trace id (from the ticket, the search hits and the thread; the first 6) with their pods, then
        every line carrying the error signature on the service in the window.
      required: true
    - name: commits
      steps: [commits, suspect_commit]
      description: >-
        Commits touching the service's directory in the four days before the ticket, and the diff of every commit the
        thread named (a pod hash that looks like a sha shows up here as a git error; known false extract).
      required: false
    - name: pagerduty incident
      steps: [pagerduty]
      description: The PagerDuty incident on the service in the window, with its status, urgency and assignee.
      required: false
    - name: repeats
      steps: [repeats]
      description: >-
        Other tickets on the same component with the same error class (up to 5, newest first), so "this looks like
        AUTH-117 again" is visible up front. Empty for a first occurrence; not date-restricted, so later tickets show
        too.
      required: false
  not_covered:
    - Jira comments and issue links (a cascade's "is caused by" links, the postmortem-style comments); the real agent read them.
    - Deploy announcements in #deploys; what shipped is inferred from git log alone.
    - Whether it is still happening now; every window is anchored on the ticket, nothing looks at the last few hours.
    - Upstream or downstream services of a cascade; only the ticket's own component is queried.
    - Only the first 6 trace ids, 3 threads, 2 named commits and 2 runbook pages are followed.
  example:
    inputs: { key: PAY-101 }
    found: >-
      The #incidents thread (alice, bob) and 16 log lines across two trace ids on two payments-api pods, @payments as
      owner, the runbook's remediation (roll back the latest deploy), commit b4d28f39 "tighten validation in charge" from
      the day before as the suspect, a resolved PagerDuty incident, and PAY-102 and PAY-108 as other PaymentGatewayTimeout
      tickets on payments-api.
  authored_by: human
