{% extends "base.html" %}{% block body %}<h1>Runs</h1>
<table><tr><th>run</th><th>flow</th><th>inputs</th><th>started</th><th>status</th><th>hits</th></tr>
{% for r in runs %}<tr><td><a href="/runs/{{ r.run_id }}" class="mono">{{ r.run_id }}</a></td><td><a href="/flows/{{ r.flow }}">{{ r.flow }}</a></td><td class="mono">{{ r.inputs }}</td><td class="small">{{ r.started[:19] }}</td>
<td><span class="pill {{ 'ok' if r.status == 'ok' else 'bad' }}">{{ r.status }}</span></td><td>{{ r.hits }}</td></tr>{% endfor %}</table>{% endblock %}
