name: codebase-agentarena
title: codebase agentarena
status: draft
version: 1
induced_from:
- 85c43525-638b-4945-b513-c437775178cd
trigger:
  type: codebase
inputs:
  question:
    type: string
    required: true
    example: What are the open pull requests about, which issues do they address, and what does this codebase do? Cite the files that matter.
steps:
- id: list_pull_requests
  title: list pull requests
  tool: github.list_pull_requests
  args:
    owner: '{{ workspace.repo_owner }}'
    per_page: 50
    repo: '{{ workspace.name }}'
    state: open
  optional: true
  empty_in_traces: true
  seen_in: 1/1 sessions
- id: list_issues
  title: list issues
  tool: github.list_issues
  args:
    owner: '{{ workspace.repo_owner }}'
    per_page: 50
    repo: '{{ workspace.name }}'
    state: open
  optional: true
  empty_in_traces: true
  seen_in: 1/1 sessions
- id: commits
  title: commits
  tool: git.git_log
  args:
    max_count: 25
- id: source
  title: source
  tool: code.read_file
  args:
    end: 120
    path: README.md
- id: owners
  title: owners
  tool: code.codeowners
  args:
    path: packages/runner
  optional: true
  empty_in_traces: true
  seen_in: 1/1 sessions
  extract:
    path:
      from: path
- id: get_pull_request_files
  title: get pull request files
  tool: github.get_pull_request_files
  args:
    owner: '{{ workspace.repo_owner }}'
    pull_number: 15
    repo: '{{ workspace.name }}'
- id: get_pull_request_files_2
  title: get pull request files 2
  tool: github.get_pull_request_files
  args:
    owner: '{{ workspace.repo_owner }}'
    pull_number: 2
    repo: '{{ workspace.name }}'
- id: search_issues
  title: search issues
  tool: github.search_issues
  args:
    per_page: 30
    q: repo:{{ workspace.repo_owner }}/{{ workspace.repo_name }} is:issue
  optional: true
  empty_in_traces: true
  seen_in: 1/1 sessions
- id: get_pull_request_status
  title: get pull request status
  tool: github.get_pull_request_status
  args:
    owner: '{{ workspace.repo_owner }}'
    pull_number: 15
    repo: '{{ workspace.name }}'
  optional: true
  empty_in_traces: true
  seen_in: 1/1 sessions
- id: source_2
  title: source 2
  tool: code.read_file
  args:
    end: 60
    path: '{{ owners.path }}/src/index.ts'
- id: source_3
  title: source 3
  tool: code.read_file
  args:
    end: 60
    path: packages/cli/src/index.ts
- id: source_4
  title: source 4
  tool: code.read_file
  args:
    end: 80
    path: docs/overview.md
- id: get_pull_request
  title: get pull request
  tool: github.get_pull_request
  args:
    owner: '{{ workspace.repo_owner }}'
    pull_number: 16
    repo: '{{ workspace.name }}'
  optional: true
  empty_in_traces: true
  seen_in: 1/1 sessions
tests:
- inputs:
    question: What are the open pull requests about, which issues do they address, and what does this codebase do? Cite the files that matter.
  expect:
    commits:
      min_hits: 1
    source:
      min_hits: 1
    get_pull_request_files:
      min_hits: 1
    get_pull_request_files_2:
      min_hits: 1
    source_2:
      min_hits: 1
    source_3:
      min_hits: 1
    source_4:
      min_hits: 1
card:
