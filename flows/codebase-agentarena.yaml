  not_covered:
  - no jira lookups
  - no slack lookups
  - no confluence lookups
  - no chronosphere lookups
  - no logz lookups
  - no pagerduty lookups
  example:
    inputs:
      question: What are the open pull requests about, which issues do they address, and what does this codebase do? Cite the files that matter.
    found: 'Every traced run had hits on: commits, get_pull_request_files, get_pull_request_files_2, source, source_2, source_3, source_4.'
  authored_by: skeleton
