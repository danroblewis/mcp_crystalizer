    - get_pull_request
    description: github.list_pull_requests (github.list_pull_requests); github.list_issues (github.list_issues); github.get_pull_request_files
      (github.get_pull_request_files); github.get_pull_request_files (github.get_pull_request_files); github.search_issues (github.search_issues);
      github.get_pull_request_status (github.get_pull_request_status); github.get_pull_request (github.get_pull_request)
    required: true
  - name: commits
    steps:
    - commits
    description: commits touching the service just before (git.git_log)
    required: true
  - name: code
    steps:
    - source
