name: induced-slack-thread
title: induced slack thread
status: draft
version: 1
induced_from:
- b4bdae3e-6ff9-4800-a330-31336e17517c
- scripted-thread-1786015740.000000-v0
- scripted-thread-1786015740.000000-v1
- scripted-thread-1786015740.000000-v2
- scripted-thread-1786298820.000001-v0
- scripted-thread-1786298820.000001-v1
- scripted-thread-1786298820.000001-v2
- scripted-thread-1786462200.000002-v0
- scripted-thread-1786462200.000002-v1
- scripted-thread-1786462200.000002-v2
- scripted-thread-1786806420.000003-v0
- scripted-thread-1786806420.000003-v1
- scripted-thread-1786806420.000003-v2
- scripted-thread-1787164140.000004-v0
- scripted-thread-1787164140.000004-v1
- scripted-thread-1787164140.000004-v2
trigger:
  type: slack_thread
inputs:
  channel_id:
    type: slack_channel_id
    required: true
    example: C542575C5
  thread_ts:
    type: slack_ts
    required: true
    example: '1787484120.000005'
steps:
- id: thread
  title: thread
  tool: slack.conversations_replies
  args:
    channel_id: '{{ inputs.channel_id }}'
    limit: 100
    thread_ts: '{{ inputs.thread_ts }}'
  extract:
    service:
      from: messages[*].text
      using: catalog:service
    trace_ids:
      from: messages[*].text
      using: ids:trace_id
      all: true
    window:
      from: messages[*].time
      using: window
      before: 1h
      after: 6h
    jira_keys:
      from: messages[*].text
      using: ids:jira_key
      all: true
    error_class_list:
      from: messages[*].text
      using: ids:error_class
      all: true
    window_4d_1d:
      from: messages[*].time
      using: window
      before: 4d
      after: 1d
    window_1d_1d_r1d:
      from: messages[*].time
      using: window
      before: 1d
      after: 1d
      round: 1d
    window_3d_1d_r1d:
      from: messages[*].time
      using: window
      before: 3d
      after: 1d
      round: 1d
    window_22d_18d_r1d:
      from: messages[*].time
      using: window
      before: 22d
      after: 18d
      round: 1d
- id: issue
  title: issue
  tool: jira.jira_get_issue
  args:
    issue_key: '{{ thread.jira_keys | first }}'
  extract:
    trace_id:
      from: fields.description
      using: ids:trace_id
    error:
      from: fields.description
      using: regex
      pattern: ^Error\s*:\s*(.+)$
    error_class:
      from: fields.summary
      using: ids:error_class
    jira_key:
      from: key
- id: jira_get_issue_comments
  title: jira get issue comments
  tool: jira.jira_get_issue_comments
  args:
    issue_key: '{{ issue.jira_key }}'
  optional: true
  seen_in: 1/16 sessions
  extract:
    sha_shorts:
      from: comments[*].body
      using: ids:sha_short
      all: true
- id: confluence
  title: confluence
  tool: confluence.confluence_search
  args:
    limit: 5
    query:
      ladder:
      - text ~ "{{ issue.error_class }}" AND space = {{ catalog.service[thread.service].confluence_space }}
      - title ~ "{{ thread.service }} runbook"
      - text ~ "{{ thread.error_class_list | first }}"
      - text ~ "{{ issue.error_class }}"
  extract:
    ids:
      from: results[*].id
      all: true
- id: code
  title: code
  tool: code.grep
  args:
    context: 2
    glob: '**/*.py'
    pattern: '{{ issue.error_class }}'
  optional: true
  seen_in: 5/16 sessions
- id: issues
  title: issues
  tool: jira.jira_search
  args:
    jql:
      ladder:
      - text ~ "{{ thread.error_class_list | first }}" ORDER BY created DESC
      - component = {{ thread.service }} AND text ~ "{{ issue.error_class }}"
    limit: 5
  optional: true
  seen_in: 6/16 sessions
- id: runbook
  title: runbook
  tool: confluence.confluence_get_page
  args:
    page_id: '{{ confluence.ids | first }}'
  extract:
    chronosphere:
      from: body
      using: regex
      pattern: ^Chronosphere\s*:\s*(.+)$
- id: metrics
  title: metrics
  tool: chronosphere.query_prometheus_range
  args:
    end: '{{ thread.window.end }}'
    query:
      ladder:
      - rate(http_requests_total{ {{ catalog.service[thread.service].prom_selector }},code=~"5.."}[5m])
      - sum({{ runbook.chronosphere }})
      - sum(rate(http_requests_total{ {{ catalog.service[thread.service].prom_selector }},status=~"5.."}[5m])) / sum(rate(http_requests_total{
        {{ catalog.service[thread.service].prom_selector }} }[5m]))
    start: '{{ thread.window.start }}'
    step_seconds: 300
- id: logs
  title: logs
  tool: logz.search_logs
  args:
    from_time: '{{ thread.window.start }}'
    query: trace_id:{{ item }}
    size: 20
    to_time: '{{ thread.window.end }}'
  forEach: ([issue.trace_id] + thread.trace_ids) | unique | list
  max_items: 5
- id: logs_2
  title: logs 2
  tool: logz.search_logs
  args:
    from_time: '{{ thread.window.start }}'
    query:
      ladder:
      - '"{{ issue.error }}" AND service:{{ thread.service }}'
      - '"{{ issue.error_class }}" AND service:{{ thread.service }}'
    size: 50
    to_time: '{{ thread.window.end }}'
- id: pagerduty
  title: pagerduty
  tool: pagerduty.list_incidents
  args:
    limit: 5
    service_ids: '{{ catalog.service[thread.service].pagerduty_service_id }}'
    since: '{{ thread.window.start }}'
    until: '{{ thread.window.end }}'
  optional: true
  seen_in: 11/16 sessions
  extract:
    ids:
      from: incidents[*].service.id
      all: true
- id: commits_2
  title: commits 2
  tool: git.git_log
  args:
    max_count: 20
    since: '{{ thread.window_3d_1d_r1d.start }}'
    until: '{{ thread.window_1d_1d_r1d.end }}'
  optional: true
  seen_in: 1/16 sessions
- id: source
  title: source
  tool: code.read_file
  args:
    path: '{{ catalog.service[thread.service].repo_path }}/handler.py'
  optional: true
  seen_in: 1/16 sessions
  extract:
    path:
      from: path
- id: pagerduty_2
  title: pagerduty 2
  tool: pagerduty.list_incidents
  args:
    service_ids: '{{ pagerduty.ids | first }}'
    since: '{{ thread.window_22d_18d_r1d.start }}'
    until: '{{ thread.window_22d_18d_r1d.end }}'
  optional: true
  seen_in: 1/16 sessions
- id: commits
  title: commits
  tool: git.git_log
  args:
    max_count: 10
    path:
      ladder:
      - '{{ catalog.service[thread.service].repo_path }}'
      - '{{ source.path }}'
    since: '{{ thread.window_4d_1d.start }}'
    until: '{{ thread.window_4d_1d.end }}'
  optional: true
  seen_in: 6/16 sessions
  extract:
    sha40s:
      from: commits[*].sha
      all: true
- id: slack
  title: slack
  tool: slack.conversations_search_messages
  args:
    limit: 20
    search_query: '{{ issue.error_class }} {{ thread.service }}'
  optional: true
  seen_in: 1/16 sessions
- id: commit
  title: commit
  tool: git.git_show
  args:
    sha: '{{ item }}'
  forEach: (commits.sha40s + jira_get_issue_comments.sha_shorts) | unique | list
  max_items: 3
  optional: true
  seen_in: 1/16 sessions
