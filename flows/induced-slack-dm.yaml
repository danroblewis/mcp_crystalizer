name: induced-slack-dm
title: induced slack dm
status: draft
version: 1
induced_from:
- 845f1217-8a0f-4135-a734-eea95a181ee5
- scripted-dm-1786020840.000500-v0
- scripted-dm-1786020840.000500-v1
- scripted-dm-1786020840.000500-v2
- scripted-dm-1786302540.000510-v0
- scripted-dm-1786302540.000510-v1
- scripted-dm-1786302540.000510-v2
- scripted-dm-1786466640.000520-v0
- scripted-dm-1786466640.000520-v1
- scripted-dm-1786466640.000520-v2
- scripted-dm-1786810380.000530-v0
- scripted-dm-1786810380.000530-v1
- scripted-dm-1786810380.000530-v2
- scripted-dm-1787169360.000540-v0
- scripted-dm-1787169360.000540-v1
- scripted-dm-1787169360.000540-v2
- scripted-dm-1787486340.000550-v0
- scripted-dm-1787486340.000550-v1
- scripted-dm-1787486340.000550-v2
trigger:
  type: slack_dm
inputs:
  text:
    type: string
    required: true
    example: hey, are you seeing notification service failures? customers report RateLimited since about 10am
steps:
- id: slack
  title: slack
  tool: slack.conversations_search_messages
  args:
    limit: 5
    search_query: '"{{ inputs.text }}"'
  extract:
    slack_dm_ids:
      from: messages.matches[*].channel.id
      all: true
    window:
      from: messages.matches[*].time
      using: window
      before: 6h
      after: 2h
    service:
      from: messages.matches[*].text
      using: catalog:service
    error_class_list:
      from: messages.matches[*].text
      using: ids:error_class
      all: true
    jira_keys:
      from: messages.matches[*].text
      using: ids:jira_key
      all: true
    slack_ts_list:
      from: messages.matches[*].thread_ts
      all: true
- id: history
  title: history
  tool: slack.conversations_history
  args:
    channel_id: '{{ slack.slack_dm_ids | first }}'
    limit: 20
  optional: true
  seen_in: 18/19 sessions
  extract:
    trace_ids:
      from: messages[*].text
      using: ids:trace_id
      all: true
- id: slack_2_2
  title: slack 2 2
  tool: slack.conversations_search_messages
  args:
    limit: 20
    search_query: '{{ slack.jira_keys | first }} in:#incidents'
  optional: true
  seen_in: 4/19 sessions
  extract:
    service:
      from: messages.matches[*].text
      using: catalog:service
    slack_channel_ids:
      from: messages.matches[*].channel.id
      all: true
    slack_ts_list:
      from: messages.matches[*].thread_ts
      all: true
    error_class_list:
      from: messages.matches[*].text
      using: ids:error_class
      all: true
    window:
      from: messages.matches[*].time
      using: window
      after: 9d
      round: 1d
    window_237h_r1h:
      from: messages.matches[*].time
      using: window
      after: 237h
      round: 1h
    window_8d_r1d:
      from: messages.matches[*].time
      using: window
      after: 8d
      round: 1d
    window_1d_2d_r1d:
      from: messages.matches[*].time
      using: window
      before: 1d
      after: 2d
      round: 1d
    window_0s_1d_r1d:
      from: messages.matches[*].time
      using: window
      before: 0s
      after: 1d
      round: 1d
    window_5d_1d_r1d:
      from: messages.matches[*].time
      using: window
      before: 5d
      after: 1d
      round: 1d
- id: logs_3
  title: logs 3
  tool: logz.search_logs
  args:
    from_time: '{{ slack_2_2.window_237h_r1h.end }}'
    query: service:notification-service AND {{ slack_2_2.error_class_list | first }}
    size: 50
  optional: true
  seen_in: 1/19 sessions
- id: pagerduty
  title: pagerduty
  tool: pagerduty.list_incidents
  args:
    limit: 25
    since: '{{ slack_2_2.window.end }}'
  optional: true
  seen_in: 1/19 sessions
- id: slack_2
  title: slack 2
  tool: slack.conversations_search_messages
  args:
    limit: 20
    search_query:
      ladder:
      - '{{ slack.service }} in:#{{ catalog.service[slack.service].incident_channel }} after:{{ slack.window.start_date }} before:{{ slack.window.end_date
        }}'
      - '{{ slack.jira_keys | first }} in:#{{ catalog.service[slack.service].incident_channel }}'
      - '{{ slack.error_class_list | first }} in:#{{ catalog.service[slack.service].incident_channel }} after:{{ slack.window.start_date }} before:{{
        slack.window.end_date }}'
      - '{{ slack.service }} {{ slack.error_class_list | first }} in:#{{ catalog.service[slack.service].incident_channel }}'
  optional: true
  seen_in: 15/19 sessions
  extract:
    slack_channel_ids:
      from: messages.matches[*].channel.id
      all: true
    slack_ts_list:
      from: messages.matches[*].thread_ts
      all: true
    jira_keys:
      from: messages.matches[*].text
      using: ids:jira_key
      all: true
    error_class_list:
      from: messages.matches[*].text
      using: ids:error_class
      all: true
    trace_ids:
      from: messages.matches[*].text
      using: ids:trace_id
      all: true
- id: metrics_2
  title: metrics 2
  tool: chronosphere.query_prometheus_range
  args:
    query: rate(http_requests_total{service="notification-service",status="429"}[5m])
    start: now-8h
    step_seconds: 300
  optional: true
  seen_in: 1/19 sessions
- id: thread
  title: thread
  tool: slack.conversations_replies
  args:
    channel_id:
      ladder:
      - '{{ slack_2.slack_channel_ids | first }}'
      - '{{ slack_2_2.slack_channel_ids | first }}'
      - '{{ slack.slack_dm_ids | first }}'
    limit: 100
    thread_ts:
      ladder:
      - '{{ slack_2.slack_ts_list | first }}'
      - '{{ slack_2_2.slack_ts_list | first }}'
      - '{{ slack.slack_ts_list | first }}'
  extract:
    trace_ids:
      from: messages[*].text
      using: ids:trace_id
      all: true
    error_class_list:
      from: messages[*].text
      using: ids:error_class
      all: true
    jira_keys:
      from: messages[*].text
      using: ids:jira_key
      all: true
- id: confluence
  title: confluence
  tool: confluence.confluence_search
  args:
    limit: 5
    query:
      ladder:
      - title ~ "{{ slack.service }} runbook"
      - '{{ slack.service }} runbook'
      - text ~ "{{ slack.error_class_list | first }}" AND space = {{ catalog.service[slack.service].confluence_space }}
      - text ~ "{{ slack_2.error_class_list | first }}" AND space = {{ catalog.service[slack.service].confluence_space }}
      - title ~ "{{ slack_2_2.service }} runbook"
      - text ~ "{{ thread.error_class_list | first }}" AND space = {{ catalog.service[slack_2_2.service].confluence_space }}
      - text ~ "{{ thread.error_class_list | first }}" AND space = {{ catalog.service[slack.service].confluence_space }}
      - '{{ slack_2_2.service }} runbook'
  extract:
    ids:
      from: results[*].id
      all: true
- id: commits
  title: commits
  tool: git.git_log
  args:
    max_count: 20
    since: '{{ slack_2_2.window_8d_r1d.end }}'
  optional: true
  seen_in: 1/19 sessions
- id: runbook
  title: runbook
  tool: confluence.confluence_get_page
  args:
    page_id: '{{ confluence.ids | first }}'
  extract:
    error_class:
      from: body
      using: ids:error_class
- id: code
  title: code
  tool: code.grep
  args:
    context: 2
    glob: '**/*.py'
    pattern:
      ladder:
      - '{{ runbook.error_class }}'
      - '{{ slack_2.error_class_list | first }}'
      - '{{ slack.error_class_list | first }}'
      - '{{ thread.error_class_list | first }}'
      - '{{ slack_2_2.error_class_list | first }}'
  extract:
    files:
      from: matches[*].file
      all: true
- id: pagerduty_2
  title: pagerduty 2
  tool: pagerduty.list_incidents
  args:
    limit: 25
    since: '{{ slack_2_2.window_1d_2d_r1d.start }}'
    until: '{{ slack_2_2.window_1d_2d_r1d.end }}'
  optional: true
  seen_in: 1/19 sessions
- id: owners
  title: owners
  tool: code.codeowners
  args:
    path: '{{ code.files | first }}'
  optional: true
  seen_in: 6/19 sessions
- id: metrics
  title: metrics
  tool: chronosphere.query_prometheus_range
  args:
    end: '{{ slack.window.end }}'
    query:
      ladder:
      - rate(http_requests_total{ {{ catalog.service[slack.service].prom_selector }},code=~"5.."}[5m])
      - rate(http_requests_total{ {{ catalog.service[slack_2_2.service].prom_selector }},code=~"5.."}[5m])
      - error_rate{ {{ catalog.service[slack_2_2.service].prom_selector }} }
    start: '{{ slack.window.start }}'
    step_seconds: 300
  extract:
    http_requests_totals:
      from: data.result[*].metric.__name__
      using: regex
      pattern: ^http_requests_total\s*:\s*(.+)$
      all: true
- id: source
  title: source
  tool: code.read_file
  args:
    path: '{{ code.files | first }}'
  optional: true
  seen_in: 7/19 sessions
  extract:
    error_class:
      from: content
      using: ids:error_class
- id: issues
  title: issues
  tool: jira.jira_search
  args:
    jql:
      ladder:
      - component = {{ slack.service }} AND labels = incident ORDER BY created DESC
      - text ~ "{{ slack_2_2.error_class_list | first }}" AND updated >= -14d
      - component = {{ slack_2_2.service }} AND labels = incident ORDER BY created DESC
    limit: 5
  optional: true
  seen_in: 7/19 sessions
  extract:
    jira_keys:
      from: issues[*].key
      all: true
    trace_ids:
      from: issues[*].fields.description
      using: ids:trace_id
      all: true
- id: logs_2
  title: logs 2
  tool: logz.search_logs
  args:
    from_time: '{{ slack.window.start }}'
    query:
      ladder:
      - '"{{ runbook.error_class }}" AND service:{{ slack.service }}'
      - '"{{ source.error_class }}" AND service:{{ slack.service }}'
      - '"{{ runbook.error_class }}" AND service:{{ slack_2_2.service }}'
      - '"{{ slack_2.error_class_list | first }}" AND service:{{ slack.service }}'
      - service:{{ slack_2_2.service }} AND {{ slack_2_2.error_class_list | first }}
      - '"{{ slack.error_class_list | first }}" AND service:{{ slack.service }}'
      - '"{{ thread.error_class_list | first }}" AND service:{{ slack.service }}'
    size: 50
    to_time: '{{ slack.window.end }}'
- id: logs
  title: logs
  tool: logz.search_logs
  args:
    from_time: '{{ slack.window.start }}'
    query: trace_id:{{ item }}
    size: 20
    to_time: '{{ slack.window.end }}'
  forEach: (history.trace_ids + issues.trace_ids + slack_2.trace_ids + thread.trace_ids) | unique | list
  max_items: 6
- id: issue
  title: issue
  tool: jira.jira_get_issue
  args:
    issue_key:
      ladder:
      - '{{ slack_2.jira_keys | first }}'
      - '{{ slack.jira_keys | first }}'
      - '{{ thread.jira_keys | first }}'
  optional: true
  seen_in: 18/19 sessions
- id: commits_2
  title: commits 2
  tool: git.git_log
  args:
    max_count: 20
    path: '{{ catalog.service[slack_2_2.service].repo_path }}'
    since: '{{ slack_2_2.window_5d_1d_r1d.start }}'
    until: '{{ slack_2_2.window_0s_1d_r1d.end }}'
  optional: true
  seen_in: 1/19 sessions
  extract:
    sha40s:
      from: commits[*].sha
      all: true
- id: jira_get_issue_comments
  title: jira get issue comments
  tool: jira.jira_get_issue_comments
  args:
    issue_key: '{{ issues.jira_keys | first }}'
  optional: true
  seen_in: 1/19 sessions
- id: commit
  title: commit
  tool: git.git_show
  args:
    sha: '{{ commits_2.sha40s | first }}'
  optional: true
  seen_in: 1/19 sessions
- id: metrics_3
  title: metrics 3
  tool: chronosphere.query_prometheus_range
  args:
    query: '{{ metrics.http_requests_totals | first }}{ {{ catalog.service[slack_2_2.service].prom_selector }} }'
    start: now-48h
    step_seconds: 3600
  optional: true
  seen_in: 1/19 sessions
- id: logs_4
  title: logs 4
  tool: logz.search_logs
  args:
    from_time: '{{ slack_2_2.window_0s_1d_r1d.end }}'
    query: service:{{ slack_2_2.service }} AND {{ source.error_class }}
    size: 5
    to_time: '{{ slack_2_2.window_237h_r1h.end_date }}T23:59:00Z'
  optional: true
  seen_in: 1/19 sessions
