name: induced-jira-ticket
title: induced jira ticket
status: draft
version: 1
induced_from:
- 1b8cd469-e5eb-4e86-a59b-f9af774b604f
trigger:
  type: jira_issue
inputs:
  key:
    type: jira_key
    required: true
    example: SUP-105
steps:
- id: issue
  title: issue
  tool: jira.jira_get_issue
  args:
    issue_key: '{{ inputs.key }}'
  extract:
    error_class_list:
      from: '[*].text'
      using: ids:error_class
      all: true
    slack_channels:
      from: '[*].text'
      using: ids:slack_channel
      all: true
    service:
      from: '[*].text'
      using: catalog:service
    trace_ids:
      from: '[*].text'
      using: ids:trace_id
      all: true
    iso_ts_list:
      from: '[*].text'
      using: ids:iso_ts
      all: true
- id: jira_get_issue_comments
  title: jira get issue comments
  tool: jira.jira_get_issue_comments
  args:
    issue_key: '{{ inputs.key }}'
  extract:
    sha_shorts:
      from: '[*].text'
      using: ids:sha_short
      all: true
- id: list_services
  title: list services
  tool: pagerduty.list_services
  args: {}
- id: slack
  title: slack
  tool: slack.conversations_search_messages
  args:
    limit: 20
    search_query: '{{ issue.error_class_list | first }} in:{{ issue.slack_channels | first }}'
  extract:
    slack_channel_ids:
      from: '[*].text'
      using: ids:slack_channel_id
      all: true
    slack_ts_list:
      from: '[*].text'
      using: ids:slack_ts
      all: true
- id: code
  title: code
  tool: code.grep
  args:
    context: 3
    pattern: '{{ issue.error_class_list | first }}'
- id: confluence
  title: confluence
  tool: confluence.confluence_search
  args:
    query: title ~ "{{ issue.service }} runbook"
- id: metrics
  title: metrics
  tool: chronosphere.query_prometheus_range
  args:
    end: '2026-08-27T15:00:00Z'
    query: sum(rate(http_requests_total{ {{ catalog.service[issue.service].prom_selector }},status=~"5.."}[5m])) / sum(rate(http_requests_total{
      {{ catalog.service[issue.service].prom_selector }} }[5m]))
    start: '2026-08-27T12:30:00Z'
    step_seconds: 300
- id: logs
  title: logs
  tool: logz.search_logs
  args:
    from_time: '2026-08-27T12:00:00Z'
    query: trace_id:{{ issue.trace_ids | first }}
    size: 100
    to_time: '2026-08-27T20:00:00Z'
- id: logs_2
  title: logs 2
  tool: logz.search_logs
  args:
    from_time: '2026-08-27T12:00:00Z'
    query: '"{{ issue.error_class_list | first }}" AND service:{{ issue.service }}'
    size: 100
    to_time: '2026-08-27T20:00:00Z'
  extract:
    trace_ids:
      from: '[*].text'
      using: ids:trace_id
      all: true
- id: commits
  title: commits
  tool: git.git_log
  args:
    max_count: 20
    path: services/{{ issue.service }}
    since: '2026-08-20T00:00:00Z'
    until: '{{ issue.iso_ts_list | first }}'
- id: commit
  title: commit
  tool: git.git_show
  args:
    sha: '{{ jira_get_issue_comments.sha_shorts | first }}'
- id: pagerduty
  title: pagerduty
  tool: pagerduty.list_incidents
  args:
    service_ids: '{{ catalog.service[issue.service].pagerduty_service_id }}'
    since: '2026-08-27T00:00:00Z'
    until: '2026-08-28T00:00:00Z'
  extract:
    pd_incident_ids:
      from: '[*].text'
      using: ids:pd_incident_id
      all: true
- id: thread
  title: thread
  tool: slack.conversations_replies
  args:
    channel_id: '{{ slack.slack_channel_ids | first }}'
    thread_ts: '{{ slack.slack_ts_list | first }}'
- id: runbook
  title: runbook
  tool: confluence.confluence_get_page
  args:
    page_id: 20014
- id: owners
  title: owners
  tool: code.codeowners
  args:
    path: '{{ catalog.service[issue.service].repo_path }}/handler.py'
- id: commits_2
  title: commits 2
  tool: git.git_log
  args:
    max_count: 20
    path: '{{ catalog.service[issue.service].repo_path }}'
    since: '2026-08-13T00:00:00Z'
    until: '{{ issue.iso_ts_list | first }}'
- id: logs_3
  title: logs 3
  tool: logz.search_logs
  args:
    from_time: '2026-08-27T12:00:00Z'
    query: trace_id:{{ item }}
    size: 100
    to_time: '2026-08-27T20:00:00Z'
  forEach: logs_2.trace_ids | unique | list
  max_items: 4
- id: pagerduty_incident
  title: pagerduty incident
  tool: pagerduty.get_incident
  args:
    incident_id: '{{ pagerduty.pd_incident_ids | first }}'
