name: induced-jira-ticket
title: induced jira ticket
status: draft
version: 1
induced_from:
- 1b8cd469-e5eb-4e86-a59b-f9af774b604f
trigger:
  type: jira_issue
inputs:
  key:
    type: jira_key
    required: true
    example: SUP-105
steps:
- id: issue
  title: issue
  tool: jira.jira_get_issue
  args:
    issue_key: '{{ inputs.key }}'
  extract:
    error_class:
      from: fields.summary
      using: ids:error_class
    iso_ts:
      from: fields.description
      using: ids:iso_ts
    service:
      from: fields.summary
      using: catalog:service
    slack_channel:
      from: fields.description
      using: ids:slack_channel
    trace_id:
      from: fields.description
      using: ids:trace_id
    window:
      from: fields.created
      using: window
      before: 30m
      after: 2h
      round: 1h
    window_1h_7h_r1h:
      from: fields.created
      using: window
      before: 1h
      after: 7h
      round: 1h
    window_7d_r1d:
      from: fields.created
      using: window
      before: 7d
      round: 1d
    window_0s_1d_r1d:
      from: fields.created
      using: window
      before: 0s
      after: 1d
      round: 1d
    window_14d_r1d:
      from: fields.created
      using: window
      before: 14d
      round: 1d
- id: jira_get_issue_comments
  title: jira get issue comments
  tool: jira.jira_get_issue_comments
  args:
    issue_key: '{{ inputs.key }}'
  extract:
    sha_shorts:
      from: comments[*].body
      using: ids:sha_short
      all: true
- id: list_services
  title: list services
  tool: pagerduty.list_services
  args: {}
- id: slack
  title: slack
  tool: slack.conversations_search_messages
  args:
    limit: 20
    search_query: '{{ issue.error_class }} in:{{ issue.slack_channel }}'
  extract:
    slack_channel_ids:
      from: messages.matches[*].channel.id
      all: true
    slack_ts_list:
      from: messages.matches[*].thread_ts
      all: true
- id: code
  title: code
  tool: code.grep
  args:
    context: 3
    pattern: '{{ issue.error_class }}'
  extract:
    files:
      from: matches[*].file
      all: true
- id: confluence
  title: confluence
  tool: confluence.confluence_search
  args:
    query: title ~ "{{ issue.service }} runbook"
  extract:
    ids:
      from: results[*].id
      all: true
- id: metrics
  title: metrics
  tool: chronosphere.query_prometheus_range
  args:
    end: '{{ issue.window.end }}'
    query: sum(rate(http_requests_total{ {{ catalog.service[issue.service].prom_selector }},status=~"5.."}[5m])) / sum(rate(http_requests_total{
      {{ catalog.service[issue.service].prom_selector }} }[5m]))
    start: '{{ issue.window.start }}'
    step_seconds: 300
- id: logs_2
  title: logs 2
  tool: logz.search_logs
  args:
    from_time: '{{ issue.window_1h_7h_r1h.start }}'
    query: '"{{ issue.error_class }}" AND service:{{ issue.service }}'
    size: 100
    to_time: '{{ issue.window_1h_7h_r1h.end }}'
  extract:
    trace_ids:
      from: hits[*]._source.trace_id
      all: true
- id: commits
  title: commits
  tool: git.git_log
  args:
    max_count: 20
    path: services/{{ issue.service }}
    since: '{{ issue.window_7d_r1d.start }}'
    until: '{{ issue.iso_ts }}'
- id: commit
  title: commit
  tool: git.git_show
  args:
    sha: '{{ jira_get_issue_comments.sha_shorts | first }}'
- id: pagerduty
  title: pagerduty
  tool: pagerduty.list_incidents
  args:
    service_ids: '{{ catalog.service[issue.service].pagerduty_service_id }}'
    since: '{{ issue.window_0s_1d_r1d.start }}'
    until: '{{ issue.window_0s_1d_r1d.end }}'
  extract:
    iso_ts_list:
      from: incidents[*].created_at
      all: true
    pd_incident_ids:
      from: incidents[*].id
      all: true
- id: logs
  title: logs
  tool: logz.search_logs
  args:
    from_time: '{{ issue.window_1h_7h_r1h.start }}'
    query: trace_id:{{ item }}
    size: 100
    to_time: '{{ issue.window_1h_7h_r1h.end }}'
  forEach: ([issue.trace_id] + logs_2.trace_ids) | unique | list
  max_items: 4
- id: thread
  title: thread
  tool: slack.conversations_replies
  args:
    channel_id: '{{ slack.slack_channel_ids | first }}'
    thread_ts: '{{ slack.slack_ts_list | first }}'
- id: runbook
  title: runbook
  tool: confluence.confluence_get_page
  args:
    page_id: '{{ confluence.ids | first }}'
- id: owners
  title: owners
  tool: code.codeowners
  args:
    path: '{{ code.files | first }}'
- id: commits_2
  title: commits 2
  tool: git.git_log
  args:
    max_count: 20
    path: '{{ catalog.service[issue.service].repo_path }}'
    since: '{{ issue.window_14d_r1d.start }}'
    until: '{{ pagerduty.iso_ts_list | first }}'
- id: pagerduty_incident
  title: pagerduty incident
  tool: pagerduty.get_incident
  args:
    incident_id: '{{ pagerduty.pd_incident_ids | first }}'
