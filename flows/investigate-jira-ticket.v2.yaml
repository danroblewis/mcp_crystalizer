  at: '2026-09-09T23:26:46.368884+00:00'
  session: 3b3e0fa6-c15f-4654-b6e4-5b4d551df293
  command: author
  inputs:
    key: PAY-108
  cost_usd: 0.49841824999999995
  ran_flows:
  - investigate-jira-ticket
