name: investigate-jira-ticket.v2
title: investigate jira ticket.v2
status: draft
version: 2
induced_from:
- 1b8cd469-e5eb-4e86-a59b-f9af774b604f
- scripted-PAY-101-v0
- scripted-PAY-101-v1
- scripted-PAY-101-v2
- scripted-PAY-102-v0
- scripted-PAY-102-v1
- scripted-PAY-102-v2
- scripted-PLAT-102-v0
- scripted-PLAT-102-v1
- scripted-PLAT-102-v2
- scripted-STF-109-v0
- scripted-STF-109-v1
- scripted-STF-109-v2
- scripted-SUP-102-v0
- scripted-SUP-102-v1
- scripted-SUP-102-v2
- 3b3e0fa6-c15f-4654-b6e4-5b4d551df293
trigger:
  type: jira_issue
inputs:
  key:
    type: jira_key
    required: true
    example: SUP-105
steps:
- id: issue
  title: issue
  tool: jira.jira_get_issue
  args:
    issue_key: '{{ inputs.key }}'
  extract:
    window:
      from: fields.updated
      using: window
      before: 6h
    error_class:
      from: fields.summary
      using: ids:error_class
    slack_channel:
      from: fields.description
      using: ids:slack_channel
    service:
      from: fields.summary
      using: catalog:service
    trace_id:
      from: fields.description
      using: ids:trace_id
    window_window:
      from: fields.created
      using: window
      before: 4d
      after: 1d
    error:
      from: fields.description
      using: regex
      pattern: ^Error\s*:\s*(.+)$
- id: jira_get_issue_comments
  title: jira get issue comments
  tool: jira.jira_get_issue_comments
  args:
    issue_key: '{{ inputs.key }}'
  optional: true
  seen_in: 1/17 sessions
  extract:
    sha_shorts:
      from: comments[*].body
      using: ids:sha_short
      all: true
- id: slack
  title: slack
  tool: slack.conversations_search_messages
  args:
    limit: 20
    search_query:
      ladder:
      - '"{{ issue.error }}" in:{{ issue.slack_channel }} after:{{ issue.window.start_date }} before:{{ issue.window.end_date }}'
      - '{{ issue.error_class }} in:{{ issue.slack_channel }} after:{{ issue.window.start_date }} before:{{ issue.window.end_date }}'
      - '{{ inputs.key }}'
      - '{{ issue.error_class }} in:{{ issue.slack_channel }}'
  extract:
    slack_channel_ids:
      from: messages.matches[*].channel.id
      all: true
    slack_ts_list:
      from: messages.matches[*].thread_ts
      all: true
- id: list_services
  title: list services
  tool: pagerduty.list_services
  args: {}
  optional: true
  seen_in: 1/17 sessions
  extract:
    ids:
      from: services[*].id
      all: true
- id: thread
  title: thread
  tool: slack.conversations_replies
  args:
    channel_id: '{{ slack.slack_channel_ids | first }}'
    limit: 50
    thread_ts: '{{ slack.slack_ts_list | first }}'
  extract:
    trace_ids:
      from: messages[*].text
      using: ids:trace_id
      all: true
    sha_shorts:
      from: messages[*].text
      using: ids:sha_short
      all: true
- id: code
  title: code
  tool: code.grep
  args:
    context: 2
    glob: '**/*.py'
    pattern: '{{ issue.error_class }}'
  extract:
    files:
      from: matches[*].file
      all: true
- id: owners
  title: owners
  tool: code.codeowners
  args:
    path: '{{ code.files | first }}'
  extract:
    path:
      from: path
- id: source
  title: source
  tool: code.read_file
  args:
    path: '{{ owners.path }}'
  optional: true
  seen_in: 10/17 sessions
- id: confluence
  title: confluence
  tool: confluence.confluence_search
  args:
    limit: 5
    query:
      ladder:
      - text ~ "{{ issue.error_class }}" AND space = {{ catalog.service[issue.service].confluence_space }}
      - title ~ "{{ issue.service }} runbook"
  extract:
    window:
      from: results[*].last_modified
      using: window
      after: 30450m
    window_window:
      from: results[*].last_modified
      using: window
      after: 510h
    window_2:
      from: results[*].last_modified
      using: window
      after: 507h
    window_3:
      from: results[*].last_modified
      using: window
      after: 515h
    window_4:
      from: results[*].last_modified
      using: window
      after: 327h
    window_5:
      from: results[*].last_modified
      using: window
      after: 495h
    window_6:
      from: results[*].last_modified
      using: window
      after: 519h
    window_7:
      from: results[*].last_modified
      using: window
      after: 159h
    ids:
      from: results[*].id
      all: true
- id: metrics
  title: metrics
  tool: chronosphere.query_prometheus_range
  args:
    end:
      ladder:
      - '{{ issue.window.end }}'
      - '{{ confluence.window_window.end }}'
    query:
      ladder:
      - rate(http_requests_total{ {{ catalog.service[issue.service].prom_selector }},code=~"5.."}[5m])
      - sum(rate(http_requests_total{ {{ catalog.service[issue.service].prom_selector }},status=~"5.."}[5m])) / sum(rate(http_requests_total{
        {{ catalog.service[issue.service].prom_selector }} }[5m]))
    start:
      ladder:
      - '{{ issue.window.start }}'
      - '{{ confluence.window.end }}'
    step_seconds: 300
- id: runbook
  title: runbook
  tool: confluence.confluence_get_page
  args:
    page_id: '{{ confluence.ids | first }}'
- id: logs
  title: logs
  tool: logz.search_logs
  args:
    from_time:
      ladder:
      - '{{ issue.window.start }}'
      - '{{ confluence.window_2.end }}'
    query: trace_id:{{ item }}
    size: 20
    to_time:
      ladder:
      - '{{ issue.window.end }}'
      - '{{ confluence.window_3.end }}'
  forEach: ([issue.trace_id] + thread.trace_ids) | unique | list
  max_items: 4
- id: logs_2
  title: logs 2
  tool: logz.search_logs
  args:
    from_time:
      ladder:
      - '{{ issue.window.start }}'
      - '{{ confluence.window_2.end }}'
    query:
      ladder:
      - '"{{ issue.error }}" AND service:{{ issue.service }}'
      - '"{{ issue.error_class }}" AND service:{{ issue.service }}'
    size: 50
    to_time:
      ladder:
      - '{{ issue.window.end }}'
      - '{{ confluence.window_3.end }}'
  extract:
    trace_ids:
      from: hits[*]._source.trace_id
      all: true
- id: commits
  title: commits
  tool: git.git_log
  args:
    max_count: 10
    path:
      ladder:
      - '{{ catalog.service[issue.service].repo_path }}'
      - services/{{ issue.service }}
    since:
      ladder:
      - '{{ issue.window_window.start }}'
      - '{{ confluence.window_4.end }}'
    until:
      ladder:
      - '{{ issue.window_window.end }}'
      - '{{ issue.window.start }}'
- id: commit
  title: commit
  tool: git.git_show
  args:
    sha:
      ladder:
      - '{{ thread.sha_shorts | first }}'
      - '{{ jira_get_issue_comments.sha_shorts | first }}'
      - 99988c8b3
- id: pagerduty
  title: pagerduty
  tool: pagerduty.list_incidents
  args:
    limit: 5
    service_ids:
      ladder:
      - '{{ catalog.service[issue.service].pagerduty_service_id }}'
      - '{{ list_services.ids | first }}'
    since:
      ladder:
      - '{{ issue.window.start }}'
      - '{{ confluence.window_5.end }}'
    until:
      ladder:
      - '{{ issue.window.end }}'
      - '{{ confluence.window_6.end }}'
  extract:
    pd_incident_ids:
      from: incidents[*].id
      all: true
- id: commit_2
  title: commit 2
  tool: git.git_show
  args:
    sha: '{{ thread.sha_shorts | first }}'
  optional: true
  seen_in: 1/17 sessions
- id: commits_2
  title: commits 2
  tool: git.git_log
  args:
    max_count: 20
    path: '{{ catalog.service[issue.service].repo_path }}'
    since: '{{ confluence.window_7.end }}'
    until: '{{ issue.window.start }}'
  optional: true
  seen_in: 1/17 sessions
- id: logs_3
  title: logs 3
  tool: logz.search_logs
  args:
    from_time:
      ladder:
      - '{{ confluence.window_2.end }}'
      - '{{ issue.window.start }}'
    query: trace_id:{{ item }}
    size: 100
    to_time:
      ladder:
      - '{{ confluence.window_3.end }}'
      - '{{ issue.window.end }}'
  forEach: logs_2.trace_ids | unique | list
  max_items: 4
  optional: true
  seen_in: 2/17 sessions
- id: pagerduty_incident
  title: pagerduty incident
  tool: pagerduty.get_incident
  args:
    incident_id: '{{ pagerduty.pd_incident_ids | first }}'
  optional: true
  seen_in: 2/17 sessions
base: investigate-jira-ticket
